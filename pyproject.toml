[project]
name = "bidadvisor"
version = "0.1.0"
description = "Funda × Kadaster bid advisor: final-price ranges and bid ladders for a personal house search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "pdfplumber>=0.11",
    "httpx>=0.27",
]

[project.scripts]
bidadvisor = "bidadvisor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bidadvisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
